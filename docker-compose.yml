services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: teamtracker-pb
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  pb-setup:
    image: python:3.12-alpine
    container_name: teamtracker-pb-setup
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c", "apk add --no-cache curl docker-cli > /dev/null 2>&1 && sh /scripts/setup-collections.sh http://pocketbase:8090"]
    restart: "no"
    profiles: ["setup"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamtracker-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_POCKETBASE_URL=http://pocketbase:8090
      - ORIGIN=http://localhost:3000
    depends_on:
      pocketbase:
        condition: service_healthy
