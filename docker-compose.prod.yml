services:
  caddy:
    image: caddy:2-alpine
    container_name: sideline-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - pocketbase

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: sideline-pb
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sideline-frontend:latest
    container_name: sideline-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PUBLIC_POCKETBASE_URL=${PUBLIC_POCKETBASE_URL:-https://api.sideline.example.com}
      - ORIGIN=${ORIGIN:-https://sideline.example.com}
    depends_on:
      pocketbase:
        condition: service_healthy

  pb-setup:
    image: alpine:3.19
    container_name: sideline-pb-setup
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    entrypoint: ["sh", "-c", "apk add --no-cache curl jq > /dev/null 2>&1 && sh /scripts/setup-collections.sh http://pocketbase:8090"]
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: "no"
    profiles: ["setup"]

volumes:
  pb_data:
  caddy_data:
  caddy_config:
