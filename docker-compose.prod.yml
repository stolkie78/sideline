# Production environment: setbaas.nl (HTTPS via Let's Encrypt)
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml --profile setup run --rm pb-setup

services:
  caddy:
    image: caddy:2-alpine
    container_name: setbaas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - pocketbase

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: setbaas-pb
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: setbaas-frontend:latest
    container_name: setbaas-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PUBLIC_POCKETBASE_URL=https://setbaas.nl/api
      - ORIGIN=https://setbaas.nl
    depends_on:
      pocketbase:
        condition: service_healthy

  pb-setup:
    image: alpine:3.19
    container_name: setbaas-pb-setup
    depends_on:
      pocketbase:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq docker-cli > /dev/null 2>&1
        docker exec setbaas-pb pocketbase superuser upsert "$$PB_ADMIN_EMAIL" "$$PB_ADMIN_PASSWORD" 2>/dev/null || true
        sh /scripts/setup-collections.sh http://pocketbase:8090
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: "no"
    profiles: ["setup"]

volumes:
  pb_data:
  caddy_data:
  caddy_config:
