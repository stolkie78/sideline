  <path d="M 225 220 Q 290 240 320 256 Q 350 272 415 292" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <path d="M 225 292 Q 290 272 320 256 Q 350 240 415 220" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  
